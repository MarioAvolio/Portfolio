<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Hub Console</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Portfolio Hub Console</h1>
    <p>A thin read-only client of the gateway: registered services, live health, one query.</p>
    <button id="refresh">Refresh</button>
  </header>
  <main id="services"></main>
  <section id="activity">
    <h2>Recent activity</h2>
    <table id="activity-table">
      <thead>
        <tr><th>Time</th><th>Service</th><th>Kind</th><th>Status</th><th>Latency</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
  <script src="app.js" defer></script>
</body>
</html>
