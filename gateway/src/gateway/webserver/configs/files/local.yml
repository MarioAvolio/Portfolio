# Gateway configuration for the local environment.
# Non-secret values only. Downstream base URLs default to localhost and can be
# overridden per service with the *_URL environment variables (e.g. in compose).
app_name: gateway
api_prefix: /gateway/api/v1
request_timeout_seconds: 60
audit_capacity: 200  # how many recent routed calls GET /audit remembers
retry_attempts: 2  # total attempts per routed call (2 = one retry); 1 disables retrying
retry_delay_seconds: 0.2  # delay before retrying a routed call

services:
  - name: portfolio-assistant
    description: RAG chatbot answering questions about Mario Avolio's professional profile.
    base_url: http://localhost:5001
    health_path: /ping
    query_path: /portfolio-assistant/api/v1/query
    query_example:
      question: What technologies does Mario know?
  - name: deep-research
    description: Multi-agent web research producing a structured report.
    base_url: http://localhost:5002
    health_path: /ping
    query_path: /deep-research/api/v1/research
    job_path: /deep-research/api/v1/research/jobs
    query_example:
      query: Latest trends in retrieval-augmented generation.
  - name: market-sentinel
    description: SWOT competitive intelligence via CrewAI + SerperDev + SQLite.
    base_url: http://localhost:5003
    health_path: /ping
    query_path: /market-sentinel/api/v1/research
    job_path: /market-sentinel/api/v1/research/jobs
    query_example:
      product: ChatGPT
      competitors:
        - Gemini
        - Copilot
