[project]
name = "gateway"
version = "0.1.0"
description = "API gateway for the Portfolio microservices hub: service registry, health aggregation and query routing over HTTP."
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.8",
    "bandit[toml]>=1.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.ruff]
line-length = 100
src = ["src", "test"]

[tool.mypy]
python_version = "3.11"
files = ["src/gateway"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["test"]
skips = ["B104"]
