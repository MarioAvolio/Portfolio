<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="AI Portfolio - Microservices Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a2a4f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <style>
      .title { font: 700 40px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      .sub   { font: 400 15px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .svc   { font: 600 13px 'Segoe UI', system-ui, sans-serif; fill: #e2e8f0; }
      .desc  { font: 400 11px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .tag   { font: 500 10px 'Segoe UI', system-ui, sans-serif; fill: #38bdf8; }
      .node  { fill: #16203b; stroke: #2b3b63; stroke-width: 1.5; }
      .gw    { fill: #15233f; stroke: url(#accent); stroke-width: 2; }
      .cli   { fill: #111b36; stroke: #2b3b63; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="380" fill="url(#bg)"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1000" height="4" fill="url(#accent)"/>

  <!-- Title block -->
  <text x="45" y="65" class="title">AI Portfolio</text>
  <text x="45" y="88" class="sub">Microservices Hub  |  FastAPI  |  Python  |  Docker</text>

  <!-- Client box -->
  <g transform="translate(50, 163)">
    <rect class="cli" width="80" height="40" rx="8"/>
    <text x="40" y="26" text-anchor="middle" class="svc">client</text>
  </g>

  <!-- Arrow client -> gateway -->
  <line x1="130" y1="183" x2="216" y2="183" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  <polygon points="216,178 228,183 216,188" fill="#38bdf8" opacity="0.6"/>

  <!-- Gateway box -->
  <g transform="translate(228, 138)">
    <rect class="gw" width="160" height="90" rx="10"/>
    <text x="80" y="28" text-anchor="middle" class="svc">gateway</text>
    <text x="80" y="46" text-anchor="middle" class="tag">service registry</text>
    <text x="80" y="62" text-anchor="middle" class="desc">health aggregation</text>
    <text x="80" y="76" text-anchor="middle" class="desc">query routing</text>
  </g>

  <!-- Arrows gateway -> services -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6">
    <!-- to node 1 (top) -->
    <path d="M388 158 H480 V107 H560"/>
    <!-- to node 2 (middle) -->
    <path d="M388 183 H560"/>
    <!-- to node 3 (bottom) -->
    <path d="M388 208 H480 V259 H560"/>
  </g>
  <g fill="#38bdf8" opacity="0.6">
    <polygon points="560,102 572,107 560,112"/>
    <polygon points="560,178 572,183 560,188"/>
    <polygon points="560,254 572,259 560,264"/>
  </g>

  <!-- Service node 1: RAG + Knowledge Base -->
  <g transform="translate(572, 80)">
    <rect class="node" width="360" height="56" rx="8"/>
    <text x="16" y="22" class="svc">RAG + Knowledge Base</text>
    <text x="16" y="38" class="desc">conversational AI grounded on curated documents</text>
    <text x="16" y="50" class="desc">pluggable LLM provider (OpenAI / Google / HF / local)</text>
  </g>

  <!-- Service node 2: Agentic Research -->
  <g transform="translate(572, 156)">
    <rect class="node" width="360" height="56" rx="8"/>
    <text x="16" y="22" class="svc">Agentic Research</text>
    <text x="16" y="38" class="desc">async multi-agent web research pipeline</text>
    <text x="16" y="50" class="desc">structured report  |  async job pattern</text>
  </g>

  <!-- Service node 3: Competitive Intelligence -->
  <g transform="translate(572, 232)">
    <rect class="node" width="360" height="56" rx="8"/>
    <text x="16" y="22" class="svc">Competitive Intelligence</text>
    <text x="16" y="38" class="desc">SWOT analysis via multi-agent crew + web search</text>
    <text x="16" y="50" class="desc">persistent reports  |  async job pattern</text>
  </g>

  <!-- Footer -->
  <text x="45" y="362" class="desc">Mario Avolio  |  AI and Cloud Engineer  |  github.com/MarioAvolio</text>
</svg>
