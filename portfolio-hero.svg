<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="AI Portfolio - Microservices Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a2a4f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <style>
      .title { font: 700 40px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      .sub   { font: 400 16px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .svc   { font: 600 14px 'Segoe UI', system-ui, sans-serif; fill: #e2e8f0; }
      .desc  { font: 400 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .port  { font: 500 11px 'Segoe UI', system-ui, sans-serif; fill: #38bdf8; }
      .node  { fill: #16203b; stroke: #2b3b63; stroke-width: 1.5; rx: 10; }
      .gw    { fill: #15233f; stroke: url(#accent); stroke-width: 2; rx: 10; }
      .cli   { fill: #111b36; stroke: #2b3b63; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>

  <rect width="1000" height="380" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="4" fill="url(#accent)"/>

  <!-- Title -->
  <text x="45" y="65" class="title">AI Portfolio</text>
  <text x="45" y="90" class="sub">Microservices Hub</text>

  <!-- Client -->
  <g transform="translate(200, 167)">
    <rect class="cli" width="72" height="36"/>
    <text x="36" y="23" text-anchor="middle" class="svc">client</text>
  </g>

  <!-- Gateway -->
  <g transform="translate(340, 140)">
    <rect class="gw" width="170" height="90"/>
    <text x="85" y="30" text-anchor="middle" class="svc">gateway</text>
    <text x="85" y="48" text-anchor="middle" class="port">:8000</text>
    <text x="85" y="70" text-anchor="middle" class="desc">service registry</text>
    <text x="85" y="84" text-anchor="middle" class="desc">query routing</text>
  </g>

  <!-- Arrow client -> gateway -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M272 185 H330"/>
  </g>
  <polygon points="330,180 342,185 330,190" fill="#38bdf8" opacity="0.6"/>

  <!-- text-intelligence -->
  <g transform="translate(610, 92)">
    <rect class="node" width="290" height="60"/>
    <text x="16" y="23" class="svc">text-intelligence  :5000</text>
    <text x="16" y="41" class="desc">structured text analysis</text>
    <text x="16" y="55" class="desc">pluggable LLM  |  free mock default</text>
  </g>

  <!-- portfolio-assistant -->
  <g transform="translate(610, 167)">
    <rect class="node" width="290" height="60"/>
    <text x="16" y="23" class="svc">portfolio-assistant  :5001</text>
    <text x="16" y="41" class="desc">RAG chatbot  |  LangChain + ChromaDB</text>
    <text x="16" y="55" class="desc">OpenAI / Google / HF / Ollama</text>
  </g>

  <!-- deep-research -->
  <g transform="translate(610, 242)">
    <rect class="node" width="290" height="60"/>
    <text x="16" y="23" class="svc">deep-research  :5002</text>
    <text x="16" y="41" class="desc">multi-agent web research</text>
    <text x="16" y="55" class="desc">OpenAI Agents SDK</text>
  </g>

  <!-- Arrows gateway -> services -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M510 155 H570 V122 H600"/>
    <path d="M510 185 H600"/>
    <path d="M510 215 H570 V272 H600"/>
  </g>
  <g fill="#38bdf8" opacity="0.6">
    <polygon points="600,117 612,122 600,127"/>
    <polygon points="600,180 612,185 600,190"/>
    <polygon points="600,267 612,272 600,277"/>
  </g>

  <!-- Footer -->
  <text x="45" y="360" class="desc">Mario Avolio  |  AI and Cloud Engineer  |  github.com/MarioAvolio</text>
</svg>
