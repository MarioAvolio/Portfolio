services:
  text-intelligence:
    build: .
    ports:
      - "5000:5000"
    environment:
      ENVIRONMENT: local
    # Liveness probe wired to the root /ping endpoint.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/ping')"]
      interval: 30s
      timeout: 3s
      retries: 3
