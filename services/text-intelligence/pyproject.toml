[project]
name = "text-intelligence"
version = "0.1.0"
description = "Text-intelligence microservice: structured text analysis (summary, sentiment, tags, language) over a pluggable LLM provider."
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_intelligence"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.ruff]
line-length = 100
src = ["src", "test"]

[tool.mypy]
python_version = "3.11"
files = ["src/text_intelligence"]
ignore_missing_imports = true
