[project]
name = "market-sentinel"
version = "0.1.0"
description = "Multi-agent competitive intelligence service (CrewAI + SQLite)"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "crewai>=0.130.0",
    "crewai-tools>=0.45.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.14",
    "bandit>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_sentinel"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
no_strict_optional = true

[tool.bandit]
exclude_dirs = ["src/market_sentinel/ai"]
skips = ["B104"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
