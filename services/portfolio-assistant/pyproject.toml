[project]
name = "insurellm"
version = "0.1.0"
description = "RAG microservice answering questions about the fictional Insurellm company, grounded in a local knowledge base."
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-chroma>=0.2",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
    "tqdm>=4.66",
]

# Optional local-embeddings backend (INSURELLM_EMBEDDINGS=hf). Heavy (torch);
# install with: uv sync --extra hf
[project.optional-dependencies]
hf = [
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.ruff]
line-length = 100
src = ["src", "test"]
# The vendored RAG core under ai/ keeps its original style; lint only new code.
extend-exclude = ["src/backend/ai"]

[tool.mypy]
python_version = "3.11"
files = ["src/backend"]
ignore_missing_imports = true
# The vendored RAG core under ai/ is untyped; type-check only the new code.
exclude = ['src/backend/ai/']
