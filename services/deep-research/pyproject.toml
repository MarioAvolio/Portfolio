[project]
name = "deep-research"
version = "0.1.0"
description = "Multi-agent research microservice: plans searches, gathers web evidence and writes a structured report using the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openai>=1.68",
    "openai-agents>=0.0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.ruff]
line-length = 100
src = ["src", "test"]
# The vendored agent code under ai/ keeps its original style; lint only new code.
extend-exclude = ["src/deep_research/ai"]

[tool.mypy]
python_version = "3.12"
files = ["src/deep_research"]
ignore_missing_imports = true
# The vendored agent code under ai/ is untyped; type-check only the new code.
exclude = ['src/deep_research/ai/']
