# Portfolio microservices hub.
#
# `docker compose up` starts all four services. The heavyweight services
# (portfolio-assistant, deep-research, market-sentinel) require API keys in a root .env:
#
#   echo "OPENAI_API_KEY=sk-..." > .env
#
# docker-compose automatically reads .env from this directory.

services:
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      PORTFOLIO_ASSISTANT_URL: http://portfolio-assistant:5001
      DEEP_RESEARCH_URL: http://deep-research:5002
      MARKET_SENTINEL_URL: http://market-sentinel:5003
    depends_on:
      - portfolio-assistant
      - deep-research
      - market-sentinel

  portfolio-assistant:
    build: ./services/portfolio-assistant
    ports:
      - "5001:5001"
    environment:
      ENVIRONMENT: local
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  deep-research:
    build: ./services/deep-research
    ports:
      - "5002:5002"
    environment:
      ENVIRONMENT: local
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  market-sentinel:
    build: ./services/market-sentinel
    ports:
      - "5003:5003"
    environment:
      ENVIRONMENT: local
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
